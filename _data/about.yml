seo:
  title: Om Prio Rekrytering
  description: Läs om Prio Rekryterings personliga och noggranna arbete med headhunting och search i hela Sverige.
hero:
  kicker: Om Prio Rekrytering
  heading_first: När rätt kompetens
  heading_second: är prio.
image:
  url: https://images.unsplash.com/photo-1761227447538-f4e1ec0a9df6?auto=format&fit=crop&w=2200&q=88
  alt: Två yrkesarbetare i ett samtal på arbetsplatsen
intro: Prio Rekrytering är ett rekryteringsföretag med fokus på headhunting och search. Vi tror på att de bästa kandidaterna inte alltid finns bland dem som aktivt söker jobb - många av de mest kompetenta personerna har redan en anställning.
paragraphs:
  - text: Därför arbetar vi aktivt med att identifiera och kontakta personer som har den erfarenhet, kompetens och personlighet som våra kunder söker. Genom en personlig och noggrann process matchar vi rätt kandidat med rätt möjlighet.
  - text: Vi arbetar nära våra kunder och lägger stor vikt vid kvalitet, personligt engagemang och långsiktiga matchningar. För oss handlar rekrytering inte om att hitta flest kandidater - utan om att hitta de kandidater som verkligen gör skillnad.
closing: Vi söker där andra inte söker.
cta:
  kicker: När rätt kompetens är prio
  heading: Berätta vem ni behöver hitta.
  text: Vi tar gärna ett första samtal om verksamheten, rollen och vad som krävs för att hitta rätt person.
  button: Starta ett uppdrag
